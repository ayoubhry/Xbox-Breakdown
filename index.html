  <main id="view" tabindex="-1">
    <noscript>
      <div style="padding:12rem 4rem 4rem;max-width:90rem">
        <h1>Xbox Breakdown</h1>
        <p>Assistant Windows de diagnostic et de réparation pour consoles Xbox One. Projet open source en développement : aucune version n’est publiée pour le moment.</p>
        <p>Sept familles de pannes sont ciblées : alimentation et démarrage, affichage, lecteur optique, stockage et système, refroidissement, connectique, électronique.</p>
        <p>Ce site reproduit l’interface d’une console et nécessite JavaScript. Le projet est disponible sur <a href="https://github.com/ayoubhry/Xbox-Breakdown">GitHub</a>.</p>
      </div>
    </noscript>
